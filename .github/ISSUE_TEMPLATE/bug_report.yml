name: Bug report
description: Report a bug or unexpected behavior in Rusk
labels: ["bug"]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you report
      options:
        - label: I am using the latest version of Rusk.
          required: true
        - label: I searched open and closed issues and this isn't reported yet.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide detailed steps to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. Enter parameter '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error output
      description: Paste any terminal logs or relevant output here.
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Rusk Version
      description: Enter the version you are using (e.g., v1.0.2 or commit hash).
    validations:
      required: false
